# Keeps the GitHub Projects board in sync on Issue / PR events.
# Copy to .github/workflows/. Assumes this guide is a submodule at vendor/ai-sdd-guide
# and the board is configured in .sdd/board.json.
# Board token, chosen in order by `sdd_board.py auth-mode`:
#   1. GitHub App (repo secret SDD_APP_PRIVATE_KEY + app_id in .sdd/board.json): an installation
#      token is created per run. If it cannot be created, the job fails (no silent fallback).
#   2. PAT (repo secret SDD_PROJECT_TOKEN): classic, `repo` (private repos), `project`, `read:org`.
#   3. Neither: board updates are skipped with a warning.
# Tier labels only need the default token.
# Security: for same-repo PRs the head branch's code runs with the board token.
# Fork PRs get no secrets (pull_request trigger), so the board is skipped for them.
name: SDD Board
on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # If the guide submodule is private, add a repo secret SDD_GUIDE_TOKEN that can read both this repo and the guide.
          token: ${{ secrets.SDD_GUIDE_TOKEN || github.token }}
          persist-credentials: false

      - name: Choose board token
        id: auth
        env:
          SDD_HAS_APP_KEY: ${{ secrets.SDD_APP_PRIVATE_KEY != '' }}
          SDD_HAS_PAT: ${{ secrets.SDD_PROJECT_TOKEN != '' }}
        run: |
          python3 vendor/ai-sdd-guide/integration/ci/sdd_board.py auth-mode --has-app-key "$SDD_HAS_APP_KEY" --has-pat "$SDD_HAS_PAT" >> "$GITHUB_OUTPUT"

      - name: Add tier label to PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          SDD_HEAD_REF: ${{ github.head_ref }}
          SDD_PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(python3 vendor/ai-sdd-guide/integration/ci/sdd_state.py branch --branch "$SDD_HEAD_REF") || {
            echo "Not an SDD branch; skipping tier label."
            exit 0
          }
          tier=$(printf '%s' "$state" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tier"])')
          label="sdd:tier-$tier"
          gh label create "$label" --force >/dev/null 2>&1 || true
          gh pr edit "$SDD_PR" --add-label "$label" || echo "::warning::could not add label $label"

      - name: Create App token
        id: app
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ steps.auth.outputs.app_id }}
          private-key: ${{ secrets.SDD_APP_PRIVATE_KEY }}
          owner: ${{ steps.auth.outputs.owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Issue opened -> backlog
        if: (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat') && github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SDD_PROJECT_TOKEN }}
          SDD_ISSUE: ${{ github.event.issue.number }}
        run: |
          bash vendor/ai-sdd-guide/orchestration/tools/sdd-board.sh set --issue "$SDD_ISSUE" --phase backlog

      - name: Issue closed -> done
        if: (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat') && github.event_name == 'issues' && github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SDD_PROJECT_TOKEN }}
          SDD_ISSUE: ${{ github.event.issue.number }}
          SDD_STATE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          reason=$(printf '%s' "${SDD_STATE_REASON:-completed}" | tr '[:upper:]' '[:lower:]')
          bash vendor/ai-sdd-guide/orchestration/tools/sdd-board.sh close --issue "$SDD_ISSUE" --reason "$reason"

      - name: PR event -> board
        if: (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat') && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SDD_PROJECT_TOKEN }}
          SDD_HEAD_REF: ${{ github.head_ref }}
          SDD_MERGED: ${{ github.event.pull_request.merged }}
          SDD_ACTION: ${{ github.event.action }}
        run: |
          closed=false
          [ "$SDD_ACTION" = "closed" ] && closed=true
          bash vendor/ai-sdd-guide/orchestration/tools/sdd-board.sh pr --branch "$SDD_HEAD_REF" --merged "${SDD_MERGED:-false}" --closed "$closed"
